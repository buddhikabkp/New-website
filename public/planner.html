<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Day Trip Planner | Ceylon Journey</title>
  <meta name="description" content="Assemble, organize, and optimize your single-day itinerary in Kandy within 25km of Haloluwa.">

  <!-- Leaflet Maps CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="planner-page-wrapper">

  <!-- ========================================================================
       TOP HEADER BAR (Matches Screenshot 3)
       ======================================================================== -->
  <header class="planner-header">
    <div class="planner-brand-group">
      <a href="index.html" class="nav-back-link">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        <span>Back</span>
      </a>
      <h1 class="planner-page-title">Day Trip Planner</h1>
    </div>

    <div class="planner-header-right">
      <span class="header-location-tag">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
          <circle cx="12" cy="10" r="3"></circle>
        </svg>
        <span>Kandy &bull; Sri Lanka</span>
      </span>
      <a href="admin.html" class="admin-pill-btn">Admin</a>
    </div>
  </header>

  <!-- ========================================================================
       TWO-COLUMN PLANNER CONTAINER (Matches Screenshot 3)
       ======================================================================== -->
  <main class="planner-main-container">
    
    <!-- LEFT COLUMN: Your Itinerary -->
    <section class="itinerary-col">
      <div class="planner-col-header">
        <div class="planner-col-header-left">
          <div class="col-header-icon-badge itinerary-icon-badge">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="3 6 9 3 15 6 21 3 21 18 15 21 9 18 3 21"></polygon>
              <line x1="9" y1="3" x2="9" y2="18"></line>
              <line x1="15" y1="6" x2="15" y2="21"></line>
            </svg>
          </div>
          <h2 class="planner-col-title" id="itinerary-stops-count">Your Itinerary</h2>
        </div>
        <span class="planner-col-badge" id="itinerary-stops-badge">0 stops</span>
      </div>
      
      <!-- Populated dynamically by app.js: empty state or active stops + map -->
      <div id="itinerary-stops-container">
        <div class="itinerary-empty-box">
          <div class="empty-box-icon">🗺️</div>
          <p class="empty-box-text">Add attractions from the list to begin planning your perfect day.</p>
        </div>
      </div>
    </section>

    <!-- RIGHT COLUMN: Add Attractions -->
    <section class="add-attractions-col">
      <div class="planner-col-header">
        <div class="planner-col-header-left">
          <div class="col-header-icon-badge add-icon-badge">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"></path>
            </svg>
          </div>
          <h2 class="planner-col-title">Add Attractions</h2>
        </div>
        <span class="planner-col-badge subtle-badge" id="planner-available-badge">Nearby</span>
      </div>

      <!-- Search Box -->
      <div class="search-input-wrapper add-attraction-search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" id="planner-add-search" class="search-input" placeholder="Search attractions to add...">
      </div>

      <!-- Scrollable List of Attraction Items -->
      <div class="add-attractions-scroll-list" id="planner-add-list">
        <!-- Populated dynamically by app.js -->
      </div>
    </section>

  </main>

  <!-- Leaflet Maps Script -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <!-- Custom Select Script -->
  <script src="js/custom-select.js"></script>
  <!-- Main Application Script -->
  <script src="js/app.js"></script>
</body>
</html>
