<?xml version="1.0" encoding="UTF-8"?>
<svg width="1350" height="980" viewBox="0 0 1350 980" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Drop shadows -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
    <filter id="actorShadow" x="-10%" y="-10%" width="120%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.12"/>
    </filter>

    <!-- Arrow markers -->
    <!-- Generalization: Hollow triangle -->
    <marker id="marker-generalization" viewBox="0 0 14 14" refX="13" refY="7" markerWidth="12" markerHeight="12" orient="auto">
      <polygon points="1,2 13,7 1,12" fill="#FFFFFF" stroke="#8B5CF6" stroke-width="2"/>
    </marker>
    <!-- Include: Indigo dashed arrow -->
    <marker id="marker-include" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M1,2 L10,6 L1,10" fill="none" stroke="#4F46E5" stroke-width="2" stroke-linecap="round"/>
    </marker>
    <!-- Extend: Crimson dashed arrow -->
    <marker id="marker-extend" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M1,2 L10,6 L1,10" fill="none" stroke="#E11D48" stroke-width="2" stroke-linecap="round"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1350" height="980" fill="#FAF9F5"/>

  <!-- Diagram Title Header -->
  <g transform="translate(40, 35)">
    <text x="0" y="0" font-size="22" font-weight="700" fill="#1E293B">Ceylon Journey — 100% Codebase-Verified Use Case Diagram</text>
    <text x="0" y="24" font-size="13" fill="#64748B">Strictly aligned with Ceylon Journey web application (Haloluwa, Kandy) • Color-Coded Interaction Lines</text>
  </g>

  <!-- Legend Box (Top Right) -->
  <g transform="translate(860, 20)">
    <rect width="450" height="92" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="16" y="22" font-size="12" font-weight="700" fill="#334155" letter-spacing="0.5">LINE COLOR LEGEND</text>
    
    <!-- Legend items row 1 -->
    <line x1="20" y1="42" x2="60" y2="42" stroke="#0284C7" stroke-width="3"/>
    <text x="68" y="46" font-size="11.5" font-weight="600" fill="#0369A1">Guest Tourist Link</text>

    <line x1="180" y1="42" x2="220" y2="42" stroke="#059669" stroke-width="3"/>
    <text x="228" y="46" font-size="11.5" font-weight="600" fill="#065F46">Registered Tourist Link</text>

    <line x1="340" y1="42" x2="380" y2="42" stroke="#EA580C" stroke-width="3"/>
    <text x="388" y="46" font-size="11.5" font-weight="600" fill="#9A3412">Admin Link</text>

    <!-- Legend items row 2 -->
    <line x1="20" y1="72" x2="60" y2="72" stroke="#8B5CF6" stroke-width="2.5" marker-end="url(#marker-generalization)"/>
    <text x="68" y="76" font-size="11.5" font-weight="600" fill="#6D28D9">&lt;&lt;generalizes&gt;&gt;</text>

    <line x1="180" y1="72" x2="220" y2="72" stroke="#4F46E5" stroke-width="2.2" stroke-dasharray="5 3" marker-end="url(#marker-include)"/>
    <text x="228" y="76" font-size="11.5" font-weight="600" fill="#3730A3">&lt;&lt;include&gt;&gt;</text>

    <line x1="340" y1="72" x2="380" y2="72" stroke="#E11D48" stroke-width="2.2" stroke-dasharray="5 3" marker-end="url(#marker-extend)"/>
    <text x="388" y="76" font-size="11.5" font-weight="600" fill="#9F1239">&lt;&lt;extend&gt;&gt;</text>
  </g>

  <!-- System Boundary Box -->
  <g transform="translate(310, 125)">
    <rect width="990" height="825" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2" filter="url(#shadow)"/>
    <rect x="0" y="0" width="990" height="38" rx="16" fill="#F8FAFC"/>
    <rect x="0" y="24" width="990" height="14" fill="#F8FAFC"/>
    <line x1="0" y1="38" x2="990" y2="38" stroke="#E2E8F0" stroke-width="1.5"/>
    <text x="24" y="25" font-size="13" font-weight="700" fill="#475569" letter-spacing="0.5">SYSTEM BOUNDARY: Ceylon Journey (Kandy, Haloluwa 25km Coverage)</text>
  </g>

  <!-- ACTORS (Left Column) -->

  <!-- 1. Guest Tourist -->
  <g transform="translate(70, 180)">
    <circle cx="50" cy="30" r="16" fill="#E0F2FE" stroke="#0284C7" stroke-width="2.5" filter="url(#actorShadow)"/>
    <line x1="50" y1="46" x2="50" y2="82" stroke="#0284C7" stroke-width="2.5"/>
    <line x1="28" y1="58" x2="72" y2="58" stroke="#0284C7" stroke-width="2.5"/>
    <line x1="50" y1="82" x2="32" y2="114" stroke="#0284C7" stroke-width="2.5"/>
    <line x1="50" y1="82" x2="68" y2="114" stroke="#0284C7" stroke-width="2.5"/>
    <rect x="0" y="122" width="100" height="26" rx="6" fill="#E0F2FE" stroke="#BAE6FD" stroke-width="1"/>
    <text x="50" y="139" font-size="12" font-weight="700" fill="#0369A1" text-anchor="middle">Guest Tourist</text>
  </g>

  <!-- 2. Registered Tourist -->
  <g transform="translate(70, 480)">
    <circle cx="50" cy="30" r="16" fill="#D1FAE5" stroke="#059669" stroke-width="2.5" filter="url(#actorShadow)"/>
    <line x1="50" y1="46" x2="50" y2="82" stroke="#059669" stroke-width="2.5"/>
    <line x1="28" y1="58" x2="72" y2="58" stroke="#059669" stroke-width="2.5"/>
    <line x1="50" y1="82" x2="32" y2="114" stroke="#059669" stroke-width="2.5"/>
    <line x1="50" y1="82" x2="68" y2="114" stroke="#059669" stroke-width="2.5"/>
    <rect x="-10" y="122" width="120" height="26" rx="6" fill="#D1FAE5" stroke="#A7F3D0" stroke-width="1"/>
    <text x="50" y="139" font-size="12" font-weight="700" fill="#065F46" text-anchor="middle">Registered Tourist</text>
  </g>

  <!-- 3. System Administrator -->
  <g transform="translate(70, 770)">
    <circle cx="50" cy="30" r="16" fill="#FFEDD5" stroke="#EA580C" stroke-width="2.5" filter="url(#actorShadow)"/>
    <line x1="50" y1="46" x2="50" y2="82" stroke="#EA580C" stroke-width="2.5"/>
    <line x1="28" y1="58" x2="72" y2="58" stroke="#EA580C" stroke-width="2.5"/>
    <line x1="50" y1="82" x2="32" y2="114" stroke="#EA580C" stroke-width="2.5"/>
    <line x1="50" y1="82" x2="68" y2="114" stroke="#EA580C" stroke-width="2.5"/>
    <rect x="-15" y="122" width="130" height="26" rx="6" fill="#FFEDD5" stroke="#FED7AA" stroke-width="1"/>
    <text x="50" y="139" font-size="12" font-weight="700" fill="#9A3412" text-anchor="middle">System Administrator</text>
  </g>

  <!-- GENERALIZATION LINE: Registered Tourist generalizes Guest Tourist -->
  <path d="M120,480 L120,335" fill="none" stroke="#8B5CF6" stroke-width="2.5" marker-end="url(#marker-generalization)"/>
  <rect x="75" y="390" width="90" height="20" rx="4" fill="#F5F3FF" stroke="#DDD6FE" stroke-width="1"/>
  <text x="120" y="404" font-size="10" font-weight="700" fill="#6D28D9" text-anchor="middle">&lt;&lt;generalizes&gt;&gt;</text>

  <!-- ========================================================================
       USE CASE CAPSULES (Inside System Boundary)
       Positions:
       Col 1: x = 360, width = 230
       Col 2: x = 680, width = 230
       Col 3: x = 990, width = 250
       ======================================================================== -->

  <!-- SECTION 1: PUBLIC / GUEST USE CASES (Top area: y ~ 170 - 370) -->
  <!-- UC01: Browse -->
  <g id="uc-browse" transform="translate(360, 175)">
    <rect width="240" height="52" rx="26" fill="#F0F9FF" stroke="#0284C7" stroke-width="2" filter="url(#shadow)"/>
    <text x="120" y="26" font-size="12.5" font-weight="700" fill="#0C4A6E" text-anchor="middle">UC01: Browse Attractions</text>
    <text x="120" y="42" font-size="11" fill="#0369A1" text-anchor="middle">Catalogue</text>
  </g>

  <!-- UC02: Search & Filter (Extends Browse) -->
  <g id="uc-filter" transform="translate(680, 175)">
    <rect width="240" height="52" rx="26" fill="#FDF2F8" stroke="#DB2777" stroke-width="1.8" stroke-dasharray="4 2" filter="url(#shadow)"/>
    <text x="120" y="26" font-size="12" font-weight="700" fill="#831843" text-anchor="middle">UC02: Search &amp; Filter</text>
    <text x="120" y="42" font-size="11" fill="#9D174D" text-anchor="middle">Attractions (≤25km)</text>
  </g>

  <!-- UC03: View Details & Etiquette -->
  <g id="uc-details" transform="translate(360, 260)">
    <rect width="240" height="52" rx="26" fill="#F0F9FF" stroke="#0284C7" stroke-width="2" filter="url(#shadow)"/>
    <text x="120" y="26" font-size="12.5" font-weight="700" fill="#0C4A6E" text-anchor="middle">UC03: View Attraction Details</text>
    <text x="120" y="42" font-size="11" fill="#0369A1" text-anchor="middle">&amp; Cultural Etiquette</text>
  </g>

  <!-- UC04: Register Tourist Account -->
  <g id="uc-register" transform="translate(360, 345)">
    <rect width="240" height="52" rx="26" fill="#F0F9FF" stroke="#0284C7" stroke-width="2" filter="url(#shadow)"/>
    <text x="120" y="32" font-size="12.5" font-weight="700" fill="#0C4A6E" text-anchor="middle">UC04: Register Tourist Account</text>
  </g>

  <!-- UC05: Log In Tourist Account -->
  <g id="uc-login" transform="translate(680, 345)">
    <rect width="240" height="52" rx="26" fill="#F0F9FF" stroke="#0284C7" stroke-width="2" filter="url(#shadow)"/>
    <text x="120" y="32" font-size="12.5" font-weight="700" fill="#0C4A6E" text-anchor="middle">UC05: Log In Tourist Account</text>
  </g>

  <!-- SECTION 2: REGISTERED TOURIST / PLANNER USE CASES (Middle area: y ~ 450 - 650) -->
  <!-- UC06: Manage Day-Trip Itinerary -->
  <g id="uc-itinerary" transform="translate(360, 480)">
    <rect width="250" height="60" rx="30" fill="#ECFDF5" stroke="#059669" stroke-width="2.5" filter="url(#shadow)"/>
    <text x="125" y="28" font-size="13" font-weight="700" fill="#064E3B" text-anchor="middle">UC06: Manage Day-Trip</text>
    <text x="125" y="46" font-size="12" fill="#065F46" text-anchor="middle">Itinerary (Planner)</text>
  </g>

  <!-- UC07: Add & Reorder Stops (Included) -->
  <g id="uc-stops" transform="translate(700, 440)">
    <rect width="230" height="48" rx="24" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.8" filter="url(#shadow)"/>
    <text x="115" y="30" font-size="12" font-weight="600" fill="#312E81" text-anchor="middle">UC07: Add &amp; Reorder Stops</text>
  </g>

  <!-- UC08: Calculate Trip Metrics (Included) -->
  <g id="uc-metrics" transform="translate(700, 505)">
    <rect width="230" height="48" rx="24" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.8" filter="url(#shadow)"/>
    <text x="115" y="30" font-size="12" font-weight="600" fill="#312E81" text-anchor="middle">UC08: Calculate Trip Metrics</text>
  </g>

  <!-- UC09: View Interactive Route Map (Included) -->
  <g id="uc-map" transform="translate(700, 570)">
    <rect width="230" height="48" rx="24" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.8" filter="url(#shadow)"/>
    <text x="115" y="25" font-size="11.5" font-weight="600" fill="#312E81" text-anchor="middle">UC09: View Interactive</text>
    <text x="115" y="40" font-size="11" fill="#3730A3" text-anchor="middle">Route Map (Leaflet)</text>
  </g>

  <!-- UC10: Optimize Route via TSP (Extends Manage Itinerary) -->
  <g id="uc-tsp" transform="translate(1010, 480)">
    <rect width="245" height="56" rx="28" fill="#FFF1F2" stroke="#E11D48" stroke-width="2" filter="url(#shadow)"/>
    <text x="122" y="26" font-size="12" font-weight="700" fill="#881337" text-anchor="middle">UC10: Optimize Route via</text>
    <text x="122" y="43" font-size="11" fill="#9F1239" text-anchor="middle">Nearest-Neighbor TSP</text>
  </g>

  <!-- UC11: Print / Export Itinerary -->
  <g id="uc-print" transform="translate(360, 580)">
    <rect width="250" height="52" rx="26" fill="#ECFDF5" stroke="#059669" stroke-width="2" filter="url(#shadow)"/>
    <text x="125" y="32" font-size="12.5" font-weight="700" fill="#064E3B" text-anchor="middle">UC11: Print / Export Itinerary</text>
  </g>

  <!-- SECTION 3: SYSTEM ADMINISTRATOR USE CASES (Bottom area: y ~ 690 - 900) -->
  <!-- UC12: Log In Administrator -->
  <g id="uc-admin-login" transform="translate(360, 710)">
    <rect width="240" height="50" rx="25" fill="#FFF7ED" stroke="#EA580C" stroke-width="2" filter="url(#shadow)"/>
    <text x="120" y="31" font-size="12.5" font-weight="700" fill="#7C2D12" text-anchor="middle">UC12: Log In Administrator</text>
  </g>

  <!-- UC13: View Dashboard KPI Metrics -->
  <g id="uc-kpis" transform="translate(680, 710)">
    <rect width="240" height="50" rx="25" fill="#FFF7ED" stroke="#EA580C" stroke-width="2" filter="url(#shadow)"/>
    <text x="120" y="31" font-size="12" font-weight="700" fill="#7C2D12" text-anchor="middle">UC13: View Dashboard KPIs</text>
  </g>

  <!-- UC14: Manage Attractions (CRUD) -->
  <g id="uc-crud" transform="translate(360, 795)">
    <rect width="250" height="56" rx="28" fill="#FFF7ED" stroke="#EA580C" stroke-width="2.5" filter="url(#shadow)"/>
    <text x="125" y="27" font-size="13" font-weight="700" fill="#7C2D12" text-anchor="middle">UC14: Manage Attractions</text>
    <text x="125" y="44" font-size="11.5" fill="#9A3412" text-anchor="middle">(Add, Edit, Delete)</text>
  </g>

  <!-- UC15: Validate 25km Boundary Rule (Included in Manage Attractions) -->
  <g id="uc-boundary" transform="translate(690, 780)">
    <rect width="245" height="52" rx="26" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.8" filter="url(#shadow)"/>
    <text x="122" y="25" font-size="11.5" font-weight="600" fill="#312E81" text-anchor="middle">UC15: Validate 25km</text>
    <text x="122" y="41" font-size="11" fill="#3730A3" text-anchor="middle">Haloluwa Boundary Rule</text>
  </g>

  <!-- UC16: Upload Attraction Image (Extends Manage Attractions) -->
  <g id="uc-upload" transform="translate(1010, 795)">
    <rect width="245" height="52" rx="26" fill="#FFF1F2" stroke="#E11D48" stroke-width="2" filter="url(#shadow)"/>
    <text x="122" y="26" font-size="12" font-weight="700" fill="#881337" text-anchor="middle">UC16: Upload Attraction</text>
    <text x="122" y="42" font-size="11" fill="#9F1239" text-anchor="middle">Media &amp; Images</text>
  </g>

  <!-- UC17: Manage Administrator Accounts -->
  <g id="uc-admins" transform="translate(360, 880)">
    <rect width="250" height="52" rx="26" fill="#FFF7ED" stroke="#EA580C" stroke-width="2" filter="url(#shadow)"/>
    <text x="125" y="26" font-size="12" font-weight="700" fill="#7C2D12" text-anchor="middle">UC17: Manage Administrator</text>
    <text x="125" y="42" font-size="11" fill="#9A3412" text-anchor="middle">Accounts (Roles &amp; Access)</text>
  </g>

  <!-- ========================================================================
       COLOR-CODED INTERACTION LINES
       ======================================================================== -->

  <!-- 1. GUEST TOURIST LINES (Sky Blue #0284C7, stroke-width 2.5) -->
  <!-- Guest -> UC01 Browse -->
  <path d="M170,240 L360,201" fill="none" stroke="#0284C7" stroke-width="2.5"/>
  <!-- Guest -> UC03 Details -->
  <path d="M170,245 L360,286" fill="none" stroke="#0284C7" stroke-width="2.5"/>
  <!-- Guest -> UC04 Register -->
  <path d="M170,255 C230,280 270,330 360,371" fill="none" stroke="#0284C7" stroke-width="2.5"/>
  <!-- Guest -> UC05 Login -->
  <path d="M170,265 C260,310 490,380 680,371" fill="none" stroke="#0284C7" stroke-width="2.5"/>

  <!-- <<extend>>: UC02 Search & Filter extends UC01 Browse (Crimson #E11D48, dashed) -->
  <path d="M680,201 L600,201" fill="none" stroke="#E11D48" stroke-width="2.2" stroke-dasharray="5 3" marker-end="url(#marker-extend)"/>
  <rect x="612" y="186" width="62" height="16" rx="3" fill="#FFF1F2" stroke="#FECDD3" stroke-width="0.8"/>
  <text x="643" y="198" font-size="9" font-weight="700" fill="#BE123C" text-anchor="middle">&lt;&lt;extend&gt;&gt;</text>

  <!-- 2. REGISTERED TOURIST LINES (Emerald Green #059669, stroke-width 2.5) -->
  <!-- Reg -> UC06 Manage Itinerary -->
  <path d="M170,540 L360,510" fill="none" stroke="#059669" stroke-width="2.5"/>
  <!-- Reg -> UC11 Print Itinerary -->
  <path d="M170,548 L360,606" fill="none" stroke="#059669" stroke-width="2.5"/>

  <!-- <<include>> relationships from UC06 Manage Itinerary (Indigo #4F46E5, dashed) -->
  <!-- UC06 -> UC07 Stops -->
  <path d="M610,500 C640,485 660,470 700,464" fill="none" stroke="#4F46E5" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#marker-include)"/>
  <rect x="625" y="468" width="66" height="16" rx="3" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="0.8"/>
  <text x="658" y="480" font-size="9" font-weight="700" fill="#3730A3" text-anchor="middle">&lt;&lt;include&gt;&gt;</text>

  <!-- UC06 -> UC08 Metrics -->
  <path d="M610,515 L700,525" fill="none" stroke="#4F46E5" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#marker-include)"/>
  <rect x="625" y="512" width="66" height="16" rx="3" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="0.8"/>
  <text x="658" y="524" font-size="9" font-weight="700" fill="#3730A3" text-anchor="middle">&lt;&lt;include&gt;&gt;</text>

  <!-- UC06 -> UC09 Map -->
  <path d="M610,530 C640,550 660,570 700,585" fill="none" stroke="#4F46E5" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#marker-include)"/>
  <rect x="625" y="556" width="66" height="16" rx="3" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="0.8"/>
  <text x="658" y="568" font-size="9" font-weight="700" fill="#3730A3" text-anchor="middle">&lt;&lt;include&gt;&gt;</text>

  <!-- <<extend>>: UC10 TSP Optimize extends UC06 Manage Itinerary (Crimson #E11D48, dashed) -->
  <path d="M1010,508 C860,508 720,510 610,510" fill="none" stroke="#E11D48" stroke-width="2.2" stroke-dasharray="5 3" marker-end="url(#marker-extend)"/>
  <rect x="780" y="498" width="66" height="16" rx="3" fill="#FFF1F2" stroke="#FECDD3" stroke-width="0.8"/>
  <text x="813" y="510" font-size="9" font-weight="700" fill="#BE123C" text-anchor="middle">&lt;&lt;extend&gt;&gt;</text>

  <!-- 3. SYSTEM ADMINISTRATOR LINES (Amber / Orange #EA580C, stroke-width 2.5) -->
  <!-- Admin -> UC12 Admin Login -->
  <path d="M170,820 L360,735" fill="none" stroke="#EA580C" stroke-width="2.5"/>
  <!-- Admin -> UC13 KPIs -->
  <path d="M170,825 C260,790 480,740 680,735" fill="none" stroke="#EA580C" stroke-width="2.5"/>
  <!-- Admin -> UC14 Manage Attractions CRUD -->
  <path d="M170,830 L360,823" fill="none" stroke="#EA580C" stroke-width="2.5"/>
  <!-- Admin -> UC17 Manage Admin Accounts -->
  <path d="M170,840 L360,906" fill="none" stroke="#EA580C" stroke-width="2.5"/>

  <!-- <<include>>: UC14 Manage Attractions includes UC15 Validate Boundary (Indigo #4F46E5, dashed) -->
  <path d="M610,815 L690,810" fill="none" stroke="#4F46E5" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#marker-include)"/>
  <rect x="620" y="802" width="66" height="16" rx="3" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="0.8"/>
  <text x="653" y="814" font-size="9" font-weight="700" fill="#3730A3" text-anchor="middle">&lt;&lt;include&gt;&gt;</text>

  <!-- <<extend>>: UC16 Upload Image extends UC14 Manage Attractions (Crimson #E11D48, dashed) -->
  <path d="M1010,821 C880,821 730,823 610,823" fill="none" stroke="#E11D48" stroke-width="2.2" stroke-dasharray="5 3" marker-end="url(#marker-extend)"/>
  <rect x="780" y="813" width="66" height="16" rx="3" fill="#FFF1F2" stroke="#FECDD3" stroke-width="0.8"/>
  <text x="813" y="825" font-size="9" font-weight="700" fill="#BE123C" text-anchor="middle">&lt;&lt;extend&gt;&gt;</text>

</svg>
